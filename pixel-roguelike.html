<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地心突围 · 像素肉鸽射击</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0912;overflow:hidden;
    font-family:"Courier New",monospace;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{
    width:min(96vw,calc(96vh*16/9));
    aspect-ratio:16/9;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0d0b14;
    border:4px solid #3a3350;
    box-shadow:0 0 40px #000;
    cursor:crosshair;
  }
  .overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:rgba(8,6,14,.88);color:#e8e2f5;text-align:center;z-index:10;
  }
  .hidden{display:none!important;}
  h1{font-size:42px;margin:0;color:#ffd24a;letter-spacing:8px;
     text-shadow:3px 3px 0 #a33c2a,6px 6px 0 #000;}
  .sub{color:#9a90b8;letter-spacing:2px;margin:0;}
  input{
    font-family:inherit;font-size:18px;padding:8px 12px;text-align:center;
    background:#1a1526;color:#ffd24a;border:3px solid #4a3f6b;outline:none;width:240px;
  }
  button{
    font-family:inherit;font-size:18px;padding:10px 26px;cursor:pointer;
    background:#a33c2a;color:#fff;border:0;
    box-shadow:0 4px 0 #5e1f14;letter-spacing:4px;
  }
  button:hover{background:#c94f3a;}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #5e1f14;}
  .help{font-size:13px;color:#6f6590;line-height:1.9;letter-spacing:1px;}
  .help b{color:#b8aed6;}
  #endTitle.win{color:#7ee081;text-shadow:3px 3px 0 #1f6b2a,6px 6px 0 #000;}
  #endTitle.lose{color:#ff5a5a;text-shadow:3px 3px 0 #6b1f1f,6px 6px 0 #000;}
  #endMsg{font-size:16px;color:#cfc6e8;line-height:2;white-space:pre-line;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>

<div id="title" class="overlay">
  <h1>地 心 突 围</h1>
  <p class="sub">— 像素肉鸽 · 地下三层 · 杀回地面 —</p>
  <input id="nameInput" maxlength="12" placeholder="输入主角名字" autocomplete="off">
  <button id="startBtn">开 始 冒 险</button>
  <div class="help">
    <b>WASD / 方向键</b> 移动 · <b>鼠标</b> 瞄准 · <b>左键</b> 射击（机枪按住连发）<br>
    走近 <b>补给箱</b> 自动开启：手枪 / 冲锋枪 / 机枪（威力随机波动）<br>
    小概率开出 <b>激光枪</b>：血量 ×10，攻击秒杀一切！<br>
    怪物会掉落 <b>血量包</b>。打倒每层 Boss 进入下一层，打通三层即可回到地面！<br>
    <b>Esc</b> 暂停
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <h1 id="endTitle"></h1>
  <p id="endMsg"></p>
  <button id="againBtn">再 来 一 局</button>
  <button id="titleBtn">返 回 标 题</button>
</div>

<script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=480,H=270,WALL=12;
ctx.imageSmoothingEnabled=false;

/* ---------------- 输入 ---------------- */
const keys={};
const mouse={x:W/2,y:H/2,down:false,pressed:false};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='Escape'&&(state==='play'||state==='pause'))state=(state==='play')?'pause':'play';
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*W/r.width;
  mouse.y=(e.clientY-r.top)*H/r.height;
});
cv.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;mouse.pressed=true;}});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- 音效 ---------------- */
let AC=null;
function sfx(f,d,type,vol,slide){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),AC.currentTime+d);
    g.gain.value=vol||0.05;
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(_){}
}

/* ---------------- 数据 ---------------- */
const WEAPONS={
  pistol:{name:'手枪',  rate:0.34, dmg:16,   spd:340, spread:0.04, auto:false, col:'#ffd24a', size:2},
  smg:   {name:'冲锋枪',rate:0.10, dmg:7,    spd:360, spread:0.10, auto:true,  col:'#7ee081', size:2},
  mg:    {name:'机枪',  rate:0.055,dmg:10,   spd:410, spread:0.15, auto:true,  col:'#ff8a5c', size:3},
  laser: {name:'激光枪',rate:0.42, dmg:99999,spd:520, spread:0,    auto:true,  col:'#ff4df0', size:5, laser:true},
};
const FLOORS=[null,
  {bg:'#221d33',tile:'#2b2540',crates:6,boss:'boss1',bossName:'巨型史莱姆',
   waves:[{chaser:4},{chaser:4,fast:3}]},
  {bg:'#1b2a24',tile:'#24352d',crates:6,boss:'boss2',bossName:'地穴射手王',
   waves:[{chaser:4,fast:2},{chaser:3,fast:3,spitter:2},{fast:4,spitter:3}]},
  {bg:'#2e1d24',tile:'#3a252d',crates:7,boss:'boss3',bossName:'深渊魔王',
   waves:[{chaser:4,spitter:2},{fast:5,spitter:3},{chaser:5,fast:4,spitter:3}]},
];

/* ---------------- 状态 ---------------- */
let state='title';
let player,bullets,ebullets,enemies,crates,pickups,parts,texts,tiles;
let floorNum=1,wave=0,spawnQueue=[],spawnTimer=0,wavePause=0;
let stairs=null,shake=0,playTime=0;
let playerName='冒险者';

const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const rand=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}}
function addText(x,y,txt,col,life,big){texts.push({x,y,txt:String(txt),col:col||'#fff',life:life||0.9,big:!!big});if(texts.length>50)texts.shift();}
function explode(x,y,col,n){for(let i=0;i<(n||12);i++){const a=Math.random()*6.28,s=rand(30,120);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.25,0.6),col,size:(Math.random()<0.4?2:1)});}}

/* ---------------- 实体 ---------------- */
function mkEnemy(type,x,y){
  const f=floorNum,s=1+0.35*(f-1);
  const base={
    chaser: {hp:30, r:7, spd:55,dmg:10,col:'#c94f4f'},
    fast:   {hp:16, r:5, spd:98,dmg:7, col:'#e0a34a'},
    spitter:{hp:26, r:7, spd:42,dmg:8, col:'#9a6bd8',shoot:2.2},
    boss1:  {hp:380,r:16,spd:44,dmg:18,col:'#e05555',boss:1,charge:1},
    boss2:  {hp:520,r:16,spd:36,dmg:14,col:'#b05ce0',boss:1,shoot:1.7},
    boss3:  {hp:800,r:18,spd:50,dmg:20,col:'#ff5a3c',boss:1,shoot:1.5,charge:1,summon:7},
  }[type];
  const hpMul=base.boss?1:s;
  return {type,x,y,r:base.r,hp:Math.round(base.hp*hpMul),maxhp:Math.round(base.hp*hpMul),
    spd:base.spd,dmg:Math.round(base.dmg*(1+0.15*(f-1))),col:base.col,boss:!!base.boss,
    shootRate:base.shoot||0,shootCd:rand(1,base.shoot||1),
    canCharge:!!base.charge,chargeCd:rand(2,3.5),chargeT:0,cvx:0,cvy:0,
    summonRate:base.summon||0,summonCd:base.summon||0,flash:0};
}
function spawnAtEdge(type){
  if(enemies.length>=40)return;
  const side=(Math.random()*4)|0;let x,y;
  if(side===0){x=rand(24,W-24);y=24;}
  else if(side===1){x=rand(24,W-24);y=H-24;}
  else if(side===2){x=24;y=rand(24,H-24);}
  else{x=W-24;y=rand(24,H-24);}
  enemies.push(mkEnemy(type,x,y));
  explode(x,y,'#8f86b0',6);
}
function spawnCrate(){
  for(let t=0;t<30;t++){
    const x=rand(28,W-28),y=rand(28,H-28);
    if(dist(x,y,player.x,player.y)>60&&!crates.some(c=>dist(x,y,c.x,c.y)<26)){
      crates.push({x,y});return;
    }
  }
}
function dropPickup(x,y,forceKind){
  let kind=forceKind;
  if(!kind){
    const r=Math.random();
    if(r<0.06&&!player.laserGot)kind='laser';
    else if(r<0.55)kind='weapon';
    else kind='health';
  }
  if(kind==='weapon'){
    const pool=['pistol','smg','smg','mg','mg'];
    const wt=pool[(Math.random()*pool.length)|0];
    pickups.push({x,y,kind:'weapon',wtype:wt,power:+(rand(0.7,1.6)).toFixed(2)});
  }else if(kind==='laser'){
    pickups.push({x,y,kind:'weapon',wtype:'laser',power:1});
  }else{
    pickups.push({x,y,kind:'health'});
  }
}

/* ---------------- 流程 ---------------- */
function newGame(name){
  playerName=name||'冒险者';
  floorNum=1;playTime=0;
  player={x:W/2,y:H-56,r:6,hp:100,maxhp:100,spd:130,
    weapon:'pistol',power:+(rand(0.9,1.2)).toFixed(2),
    cd:0,invuln:0,aim:-1.57,laserGot:false};
  setupFloor();
  state='play';
}
function setupFloor(){
  bullets=[];ebullets=[];enemies=[];crates=[];pickups=[];parts=[];texts=[];
  stairs=null;shake=0;wave=0;spawnQueue=[];spawnTimer=0;wavePause=2.2;
  const cfg=FLOORS[floorNum];
  tiles=[];
  for(let y=WALL;y<H-WALL;y+=16)for(let x=WALL;x<W-WALL;x+=16)
    if(Math.random()<0.28)tiles.push({x:x+(Math.random()*9|0),y:y+(Math.random()*9|0)});
  player.x=W/2;player.y=H-56;
  for(let i=0;i<cfg.crates;i++)spawnCrate();
  addText(W/2,110,'— 第 '+floorNum+' 层 —','#fff',2.2,true);
  sfx(200,0.4,'triangle',0.06,400);
}
function spawnBoss(){
  const cfg=FLOORS[floorNum];
  const b=mkEnemy(cfg.boss,W/2,54);
  enemies.push(b);
  addText(W/2,110,'BOSS：'+cfg.bossName,'#ff5a5a',2.5,true);
  sfx(90,0.7,'sawtooth',0.09,40);
  shake=5;
}
function onBossDown(e){
  explode(e.x,e.y,e.col,30);shake=7;
  sfx(60,0.9,'sawtooth',0.12,30);
  if(floorNum>=3){winGame();return;}
  stairs={x:W/2,y:60};
  dropPickup(e.x-14,e.y,'health');
  dropPickup(e.x+14,e.y,'health');
  spawnCrate();spawnCrate();
  addText(W/2,110,'通道开启！走到上方洞口进入下一层','#7ee081',3,true);
}
function winGame(){
  state='win';
  sfx(523,0.15,'square',0.07);setTimeout(()=>sfx(659,0.15,'square',0.07),150);
  setTimeout(()=>sfx(784,0.3,'square',0.08),300);
  showEnd(true);
}
function loseGame(){
  state='lose';
  sfx(220,0.8,'sawtooth',0.09,55);
  showEnd(false);
}
function showEnd(win){
  const t=document.getElementById('endTitle'),m=document.getElementById('endMsg');
  const mm=String((playTime/60)|0).padStart(2,'0'),ss=String((playTime%60)|0).padStart(2,'0');
  t.className=win?'win':'lose';
  if(win){
    t.textContent='☀ 重 返 地 面 ☀';
    m.textContent='恭喜 '+playerName+' 杀穿地下三层，重见天日！\n'+
      '通关用时 '+mm+':'+ss+(player.laserGot?'\n（传说中的激光枪持有者）':'')+
      '\n阳光正好，怪物已成回忆。';
  }else{
    t.textContent='你 倒 下 了';
    m.textContent=playerName+' 倒在了第 '+floorNum+' 层……\n坚持时间 '+mm+':'+ss+'\n补给箱里的激光枪，下一把一定出！';
  }
  document.getElementById('endScreen').classList.remove('hidden');
}

/* ---------------- 更新 ---------------- */
function fire(){
  const w=WEAPONS[player.weapon];
  const jit=rand(0.9,1.1);
  const ang=player.aim+(Math.random()-0.5)*2*w.spread;
  bullets.push({x:player.x+Math.cos(player.aim)*11,y:player.y+Math.sin(player.aim)*11,
    vx:Math.cos(ang)*w.spd,vy:Math.sin(ang)*w.spd,
    dmg:Math.max(1,Math.round(w.dmg*player.power*jit)),
    size:w.size,laser:!!w.laser,pierce:!!w.laser,life:1.4,col:w.col});
  for(let i=0;i<3;i++)parts.push({x:player.x+Math.cos(player.aim)*12,y:player.y+Math.sin(player.aim)*12,
    vx:Math.cos(ang+rand(-0.5,0.5))*70,vy:Math.sin(ang+rand(-0.5,0.5))*70,life:0.12,col:'#ffe9a3',size:1});
  sfx(w.laser?1100:rand(520,640),w.laser?0.18:0.06,w.laser?'sawtooth':'square',w.laser?0.06:0.032,w.laser?250:150);
  if(player.weapon==='mg')shake=Math.min(shake+0.15,2);
  if(w.laser)shake=Math.min(shake+1,3);
}

function update(dt){
  playTime+=dt;
  shake=Math.max(0,shake-dt*10);
  player.cd-=dt;player.invuln-=dt;

  /* 移动 */
  let mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  let my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  if(mx&&my){mx*=0.707;my*=0.707;}
  player.x=Math.max(WALL+player.r,Math.min(W-WALL-player.r,player.x+mx*player.spd*dt));
  player.y=Math.max(WALL+player.r,Math.min(H-WALL-player.r,player.y+my*player.spd*dt));
  player.aim=Math.atan2(mouse.y-player.y,mouse.x-player.x);

  /* 开火 */
  const w=WEAPONS[player.weapon];
  if(((w.auto&&mouse.down)||(!w.auto&&mouse.pressed))&&player.cd<=0){fire();player.cd=w.rate;}

  /* 波次 / Boss */
  if(!stairs&&!enemies.some(e=>e.boss)){
    if(spawnQueue.length){
      spawnTimer-=dt;
      if(spawnTimer<=0){spawnTimer=0.45;spawnAtEdge(spawnQueue.shift());}
    }else if(enemies.length===0){
      wavePause-=dt;
      if(wavePause<=0){
        wave++;
        const cfg=FLOORS[floorNum];
        if(wave<=cfg.waves.length){
          const wd=cfg.waves[wave-1];
          for(const k in wd)for(let i=0;i<wd[k];i++)spawnQueue.push(k);
          shuffle(spawnQueue);
          wavePause=2;spawnTimer=1;
          addText(W/2,110,'第 '+wave+' / '+cfg.waves.length+' 波','#ffd24a',1.6,true);
          spawnCrate();
          sfx(330,0.2,'triangle',0.06,520);
        }else spawnBoss();
      }
    }
  }

  /* 敌人 */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.flash-=dt;
    const d=dist(e.x,e.y,player.x,player.y);
    const angP=Math.atan2(player.y-e.y,player.x-e.x);
    let vx=0,vy=0;

    if(e.chargeT>0){
      e.chargeT-=dt;vx=e.cvx;vy=e.cvy;
    }else if(e.type==='spitter'){
      if(d>130){vx=Math.cos(angP)*e.spd;vy=Math.sin(angP)*e.spd;}
      else if(d<90){vx=-Math.cos(angP)*e.spd*0.7;vy=-Math.sin(angP)*e.spd*0.7;}
    }else{
      vx=Math.cos(angP)*e.spd;vy=Math.sin(angP)*e.spd;
    }

    if(e.canCharge){
      e.chargeCd-=dt;
      if(e.chargeCd<=0&&e.chargeT<=0&&d>40){
        e.chargeT=0.55;
        e.cvx=Math.cos(angP)*e.spd*4.2;
        e.cvy=Math.sin(angP)*e.spd*4.2;
        e.chargeCd=rand(2.6,3.8);
        sfx(150,0.25,'sawtooth',0.05,320);
      }
    }
    if(e.shootRate){
      e.shootCd-=dt;
      if(e.shootCd<=0){
        e.shootCd=e.shootRate;
        if(e.boss){
          const n=12,off=Math.random()*6.28;
          for(let k=0;k<n;k++){
            const a=off+k/n*6.28;
            ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*115,vy:Math.sin(a)*115,dmg:e.dmg});
          }
          sfx(180,0.3,'sawtooth',0.06,90);
        }else{
          ebullets.push({x:e.x,y:e.y,vx:Math.cos(angP)*140,vy:Math.sin(angP)*140,dmg:e.dmg});
          sfx(300,0.1,'square',0.03,180);
        }
      }
    }
    if(e.summonRate){
      e.summonCd-=dt;
      if(e.summonCd<=0){
        e.summonCd=e.summonRate;
        for(let k=0;k<2;k++)if(enemies.length<14)
          enemies.push(mkEnemy('fast',e.x+rand(-20,20),e.y+rand(-20,20)));
        addText(e.x,e.y-e.r-6,'召唤！','#ff9a3c',0.8);
      }
    }

    e.x=Math.max(WALL+e.r,Math.min(W-WALL-e.r,e.x+vx*dt));
    e.y=Math.max(WALL+e.r,Math.min(H-WALL-e.r,e.y+vy*dt));

    /* 敌人互相挤开 */
    for(let j=i-1;j>=0;j--){
      const o=enemies[j],dd=dist(e.x,e.y,o.x,o.y),min=e.r+o.r;
      if(dd<min&&dd>0.01){
        const push=(min-dd)/2,px=(e.x-o.x)/dd,py=(e.y-o.y)/dd;
        e.x+=px*push;e.y+=py*push;o.x-=px*push;o.y-=py*push;
      }
    }

    /* 撞玩家 */
    if(dist(e.x,e.y,player.x,player.y)<e.r+player.r&&player.invuln<=0){
      hurtPlayer(e.dmg);
    }
  }

  /* 玩家子弹 */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<WALL||b.x>W-WALL||b.y<WALL||b.y>H-WALL){
      explode(b.x,b.y,b.col,3);bullets.splice(i,1);continue;
    }
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(dist(b.x,b.y,e.x,e.y)<e.r+b.size){
        e.hp-=b.dmg;e.flash=0.08;
        if(!e.boss){const kb=b.laser?0:3;e.x+=b.vx/410*kb;e.y+=b.vy/410*kb;}
        addText(e.x+rand(-4,4),e.y-e.r-4,b.dmg>999?'秒杀!':b.dmg,b.laser?'#ff4df0':'#fff',0.5);
        explode(b.x,b.y,b.col,b.laser?8:2);
        sfx(b.laser?1400:900,0.04,'square',0.02,400);
        if(e.hp<=0)killEnemy(j);
        if(!b.pierce){bullets.splice(i,1);}
        break;
      }
    }
  }

  /* 敌方子弹 */
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<WALL||b.x>W-WALL||b.y<WALL||b.y>H-WALL){ebullets.splice(i,1);continue;}
    if(dist(b.x,b.y,player.x,player.y)<player.r+2&&player.invuln<=0){
      ebullets.splice(i,1);hurtPlayer(b.dmg);
    }
  }

  /* 补给箱 */
  for(let i=crates.length-1;i>=0;i--){
    const c=crates[i];
    if(dist(c.x,c.y,player.x,player.y)<16){
      crates.splice(i,1);
      explode(c.x,c.y,'#a3703a',10);
      sfx(500,0.12,'triangle',0.07,900);
      dropPickup(c.x,c.y);
      addText(c.x,c.y-12,'开箱！','#ffd24a',0.8);
    }
  }

  /* 拾取物 */
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    if(dist(p.x,p.y,player.x,player.y)<13){
      if(p.kind==='health'){
        if(player.hp>=player.maxhp)continue;
        const heal=Math.round(Math.max(30,player.maxhp*0.1));
        player.hp=Math.min(player.maxhp,player.hp+heal);
        addText(p.x,p.y-10,'+'+heal+' HP','#7ee081',1);
        sfx(660,0.15,'sine',0.07,990);
      }else{
        player.weapon=p.wtype;player.power=p.power;
        const wn=WEAPONS[p.wtype].name;
        if(p.wtype==='laser'){
          player.laserGot=true;
          player.maxhp=1000;player.hp=1000;
          addText(W/2,110,'传说武器·激光枪！血量×10，攻击秒杀！','#ff4df0',3,true);
          sfx(880,0.5,'sawtooth',0.09,1760);
          shake=4;
        }else{
          addText(p.x,p.y-10,wn+' ×'+p.power.toFixed(2),'#ffd24a',1.2);
          sfx(520,0.12,'square',0.06,780);
        }
      }
      pickups.splice(i,1);
    }
  }

  /* 下一层 */
  if(stairs&&dist(stairs.x,stairs.y,player.x,player.y)<16){
    floorNum++;
    player.hp=Math.min(player.maxhp,player.hp+Math.round(player.maxhp*0.3));
    setupFloor();
  }

  /* 粒子 / 漂浮文字 */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i];t.y-=18*dt;t.life-=dt;
    if(t.life<=0)texts.splice(i,1);
  }
}

function hurtPlayer(dmg){
  player.hp-=dmg;player.invuln=0.7;shake=Math.min(shake+3,6);
  explode(player.x,player.y,'#4aa3ff',8);
  sfx(180,0.2,'sawtooth',0.08,60);
  addText(player.x,player.y-12,'-'+dmg,'#ff5a5a',0.8);
  if(player.hp<=0){player.hp=0;loseGame();}
}
function killEnemy(j){
  const e=enemies[j];
  explode(e.x,e.y,e.col,e.boss?30:10);
  if(!e.boss){
    sfx(240,0.12,'square',0.04,80);
    if(Math.random()<0.13)dropPickup(e.x,e.y,'health');
  }
  enemies.splice(j,1);
  if(e.boss)onBossDown(e);
}

/* ---------------- 绘制 ---------------- */
function draw(){
  const cfg=FLOORS[floorNum]||FLOORS[1];
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  /* 地面 */
  ctx.fillStyle=(state==='title')?'#0d0b14':cfg.bg;
  ctx.fillRect(-8,-8,W+16,H+16);
  if(state!=='title'){
    ctx.fillStyle=cfg.tile;
    for(const t of tiles)ctx.fillRect(t.x,t.y,4,2);
  }

  if(state==='play'||state==='pause'||state==='win'||state==='lose'){
    /* 墙 */
    ctx.fillStyle='#14101f';
    ctx.fillRect(0,0,W,WALL);ctx.fillRect(0,H-WALL,W,WALL);
    ctx.fillRect(0,0,WALL,H);ctx.fillRect(W-WALL,0,WALL,H);
    ctx.fillStyle='#241d38';
    ctx.fillRect(0,WALL-2,W,2);ctx.fillRect(0,H-WALL,W,2);
    ctx.fillRect(WALL-2,0,2,H);ctx.fillRect(W-WALL,0,2,H);

    /* 通道 */
    if(stairs){
      const t=performance.now()/300;
      ctx.fillStyle='#050308';ctx.fillRect(stairs.x-13,stairs.y-9,26,18);
      ctx.fillStyle=(t|0)%2?'#7ee081':'#3c9a55';
      ctx.fillRect(stairs.x-11,stairs.y-7,22,2);
      ctx.fillRect(stairs.x-11,stairs.y-2,22,2);
      ctx.fillRect(stairs.x-11,stairs.y+3,22,2);
      ctx.fillStyle='#7ee081';ctx.font='7px monospace';ctx.textAlign='center';
      ctx.fillText('下一层 ▲',stairs.x,stairs.y-13);
    }

    /* 补给箱 */
    for(const c of crates){
      ctx.fillStyle='#7a4f26';ctx.fillRect(c.x-7|0,c.y-6|0,14,12);
      ctx.fillStyle='#a3703a';ctx.fillRect(c.x-6|0,c.y-5|0,12,10);
      ctx.fillStyle='#5e3a1a';ctx.fillRect(c.x-1|0,c.y-5|0,2,10);
      ctx.fillStyle='#ffd24a';ctx.fillRect(c.x-1|0,c.y-1|0,2,2);
    }

    /* 拾取物 */
    for(const p of pickups){
      const bob=Math.sin(performance.now()/250+p.x)*1.5|0;
      if(p.kind==='health'){
        ctx.fillStyle='#e8e8e8';ctx.fillRect(p.x-5|0,p.y-4+bob,10,8);
        ctx.fillStyle='#e03a3a';
        ctx.fillRect(p.x-1|0,p.y-3+bob,2,6);
        ctx.fillRect(p.x-3|0,p.y-1+bob,6,2);
      }else{
        const col=WEAPONS[p.wtype].col;
        ctx.fillStyle='#1a1526';ctx.fillRect(p.x-7|0,p.y-5+bob,14,10);
        ctx.fillStyle=col;ctx.fillRect(p.x-5|0,p.y-2+bob,10,3);
        ctx.fillRect(p.x+2|0,p.y+1+bob,3,3);
        if(p.wtype==='laser'){
          ctx.fillStyle=(performance.now()/150|0)%2?'#fff':'#ff4df0';
          ctx.fillRect(p.x-1|0,p.y-8+bob,2,2);
        }
      }
    }

    /* 敌人 */
    for(const e of enemies){
      const x=e.x|0,y=e.y|0;
      const col=e.flash>0?'#ffffff':e.col;
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.fillRect(x-e.r,y+e.r-2,e.r*2,3);
      ctx.fillStyle=col;
      if(e.type==='fast'){
        ctx.fillRect(x-e.r,y-e.r+2,e.r*2,e.r*2-2);
        ctx.fillRect(x-2,y-e.r-2,4,4);
      }else{
        ctx.fillRect(x-e.r,y-e.r+2,e.r*2,e.r*2-2);
        ctx.fillRect(x-e.r+2,y-e.r,e.r*2-4,3);
      }
      /* 眼睛 */
      ctx.fillStyle=e.flash>0?'#f00':'#1a0d14';
      ctx.fillRect(x-e.r/2,y-2,2,2);
      ctx.fillRect(x+e.r/2-2,y-2,2,2);
      if(e.boss){
        ctx.fillStyle='#ffd24a';
        ctx.fillRect(x-6,y-e.r-6,3,3);ctx.fillRect(x-1,y-e.r-8,3,5);ctx.fillRect(x+4,y-e.r-6,3,3);
        if(e.canCharge&&e.chargeCd<0.6&&e.chargeT<=0){
          ctx.fillStyle='#ff0';ctx.fillRect(x-2,y-e.r-14,4,4);
        }
      }
      /* 小怪血条 */
      if(!e.boss&&e.hp<e.maxhp){
        ctx.fillStyle='#000';ctx.fillRect(x-7,y-e.r-5,14,2);
        ctx.fillStyle='#e03a3a';ctx.fillRect(x-7,y-e.r-5,14*Math.max(0,e.hp/e.maxhp)|0,2);
      }
    }

    /* 玩家 */
    if(!(player.invuln>0&&(performance.now()/90|0)%2)){
      const x=player.x|0,y=player.y|0;
      ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(x-5,y+6,10,3);
      ctx.fillStyle='#2b5fa3';ctx.fillRect(x-4,y-1,8,8);         // 身体
      ctx.fillStyle='#f2c79b';ctx.fillRect(x-3,y-7,6,6);         // 头
      ctx.fillStyle='#3a2a1a';ctx.fillRect(x-3,y-7,6,2);         // 头发
      ctx.fillStyle='#1a0d14';
      ctx.fillRect(x+(Math.cos(player.aim)>0?0:-2),y-5,2,2);     // 眼
      ctx.save();
      ctx.translate(player.x,player.y);
      ctx.rotate(player.aim);
      ctx.fillStyle=WEAPONS[player.weapon].col;
      ctx.fillRect(4,-2,player.weapon==='laser'?16:11,3);
      ctx.fillStyle='#333';ctx.fillRect(4,1,4,3);
      ctx.restore();
    }

    /* 子弹 */
    for(const b of bullets){
      ctx.fillStyle=b.col;
      if(b.laser){
        ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));
        ctx.fillRect(-8,-2,16,4);
        ctx.fillStyle='#fff';ctx.fillRect(-6,-1,12,2);
        ctx.restore();
      }else{
        ctx.fillRect(b.x-b.size/2|0,b.y-b.size/2|0,b.size,b.size);
      }
    }
    ctx.fillStyle='#d66bff';
    for(const b of ebullets)ctx.fillRect(b.x-2|0,b.y-2|0,3,3);

    /* 粒子 */
    for(const p of parts){ctx.fillStyle=p.col;ctx.fillRect(p.x|0,p.y|0,p.size,p.size);}

    /* 漂浮文字 */
    ctx.textAlign='center';
    for(const t of texts){
      ctx.font=t.big?'bold 11px monospace':'8px monospace';
      ctx.fillStyle='#000';ctx.fillText(t.txt,t.x+1,t.y+1);
      ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
    }

    drawHUD();
  }

  if(state==='pause'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.textAlign='center';
    ctx.fillText('已暂停 · Esc 继续',W/2,H/2);
  }
  ctx.restore();
}

function drawHUD(){
  ctx.textAlign='left';
  /* 血条 */
  const bw=70;
  ctx.fillStyle='#000';ctx.fillRect(17,17,bw+2,8);
  ctx.fillStyle='#3a0d0d';ctx.fillRect(18,18,bw,6);
  const ratio=Math.max(0,player.hp/player.maxhp);
  ctx.fillStyle=player.laserGot?'#ff4df0':(ratio>0.35?'#4ac94a':'#e03a3a');
  ctx.fillRect(18,18,bw*ratio|0,6);
  ctx.fillStyle='#fff';ctx.font='7px monospace';
  ctx.fillText(Math.ceil(player.hp)+'/'+player.maxhp,20,23.5);

  /* 武器 */
  const w=WEAPONS[player.weapon];
  ctx.fillStyle=w.col;ctx.fillRect(17,29,8,5);
  ctx.fillStyle='#fff';ctx.font='8px monospace';
  ctx.fillText(w.name+' ×'+player.power.toFixed(2),29,35);

  /* 层数 */
  ctx.textAlign='right';
  ctx.fillStyle='#ffd24a';ctx.font='9px monospace';
  ctx.fillText('第 '+floorNum+' / 3 层',W-17,24);
  ctx.fillStyle='#9a90b8';ctx.font='7px monospace';
  const cfg=FLOORS[floorNum];
  const boss=enemies.find(e=>e.boss);
  ctx.fillText(boss?'BOSS 战！':(stairs?'前往通道 →':('波次 '+Math.min(wave,cfg.waves.length)+' / '+cfg.waves.length)),W-17,34);
  ctx.fillText(playerName,W-17,44);

  /* Boss 血条 */
  if(boss){
    ctx.textAlign='center';
    ctx.fillStyle='#000';ctx.fillRect(W/2-81,15,162,10);
    ctx.fillStyle='#3a0d0d';ctx.fillRect(W/2-80,16,160,8);
    ctx.fillStyle='#e03a3a';ctx.fillRect(W/2-80,16,160*Math.max(0,boss.hp/boss.maxhp)|0,8);
    ctx.fillStyle='#fff';ctx.font='7px monospace';
    ctx.fillText(cfg.bossName+'  '+Math.max(0,Math.ceil(boss.hp))+'/'+boss.maxhp,W/2,22.5);
  }

  /* 准星 */
  ctx.fillStyle='#fff';
  ctx.fillRect(mouse.x-4|0,mouse.y|0,2,1);ctx.fillRect(mouse.x+3|0,mouse.y|0,2,1);
  ctx.fillRect(mouse.x|0,mouse.y-4|0,1,2);ctx.fillRect(mouse.x|0,mouse.y+3|0,1,2);
}

/* ---------------- 主循环 ---------------- */
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-last)/1000||0.016);
  last=t;
  if(state==='play')update(dt);
  draw();
  mouse.pressed=false;
}
requestAnimationFrame(loop);

/* ---------------- UI ---------------- */
const $=id=>document.getElementById(id);
function startFromUI(){
  const name=$('nameInput').value.trim()||'冒险者';
  $('title').classList.add('hidden');
  $('endScreen').classList.add('hidden');
  newGame(name);
}
$('startBtn').onclick=startFromUI;
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')startFromUI();});
$('againBtn').onclick=()=>{$('endScreen').classList.add('hidden');newGame(playerName);};
$('titleBtn').onclick=()=>{
  $('endScreen').classList.add('hidden');
  $('title').classList.remove('hidden');
  state='title';
};
</script>
</body>
